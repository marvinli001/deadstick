<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>白菊讣告</title>
<style>
:root{--white:#ffffff;--ink:#111111;--chry:#f2c200;--grey:#9a9a9a;--rule:#e8e8e8}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--white);color:var(--ink);font-family:"Songti SC","PingFang SC",serif}
.frame{position:absolute;inset:32px;border:10px solid var(--ink)}
header{position:absolute;left:72px;right:72px;top:64px;display:flex;font:22px "PingFang SC";letter-spacing:4px}
header nav{margin-left:auto;display:flex;gap:36px}
.flower{position:absolute;left:670px;top:150px;width:100px;height:100px;border-radius:50%;background:repeating-conic-gradient(var(--chry) 0 12deg,#ffffff 12deg 16deg)}
h1{position:absolute;left:0;right:0;top:290px;text-align:center;font-size:180px;font-weight:600;letter-spacing:24px}
.dates{position:absolute;left:0;right:0;top:520px;text-align:center;font:40px "Menlo",monospace;letter-spacing:6px}
.act{position:absolute;left:520px;top:620px;width:400px;display:flex;justify-content:space-between;font:28px "PingFang SC"}
.act span{border-bottom:3px solid var(--ink);padding-bottom:6px}
.list{position:absolute;left:72px;right:72px;bottom:72px;display:flex;justify-content:space-between;font:24px "PingFang SC";color:var(--grey);border-top:2px solid var(--ink);padding-top:20px}
</style>
</head>
<body>
<div class="frame"></div>
<header><span>DEADSTICK</span><nav><span>墓园</span><span>机场</span><span>投稿</span><span>登录</span></nav></header>
<div class="flower"></div>
<h1>示例云</h1>
<div class="dates">2024.03.11 — 2026.10.31</div>
<div class="act"><span>献花 1204</span><span>点烛 388</span><span>上香 97</span></div>
<div class="list"><span>月光网络</span><span>星际</span><span>极光</span><span>白鲸</span><span>银河</span><span>飞猫</span><span>云梯</span></div>
</body>
</html>
